[tool.poetry]
name = "carbon254-libs-python"
version = "0.0.0-dev"
description = "Shared Python libraries for the 254Carbon platform"
authors = ["254Carbon Engineering <engineering@254carbon.com>"]
readme = "README.md"
packages = [{ include = "carbon254", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
httpx = "^0.27.0"
sqlalchemy = "^2.0.23"
pydantic = "^2.5.3"
pydantic-settings = "^2.1.0"
confluent-kafka = "^2.3.0"
starlette = ">=0.27.0,<0.28.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.4"
pytest-asyncio = "^0.21.1"
black = "^23.12.1"
ruff = "^0.1.8"
mypy = "^1.7.1"

[build-system]
requires = ["poetry-core>=1.6.0"]
build-backend = "poetry.core.masonry.api"

