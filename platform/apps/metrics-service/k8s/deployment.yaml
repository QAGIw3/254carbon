apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-service
  namespace: market-intelligence
spec:
  replicas: 2
  selector:
    matchLabels:
      app: metrics-service
  template:
    metadata:
      labels:
        app: metrics-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8012"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: metrics-service
        image: docker.io/254carbon/metrics-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8012
          name: http
        env:
        - name: PORT
          value: "8012"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8012
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8012
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-service
  namespace: market-intelligence
  labels:
    app: metrics-service
spec:
  selector:
    app: metrics-service
  ports:
  - port: 8012
    targetPort: 8012
    name: http
  type: ClusterIP

