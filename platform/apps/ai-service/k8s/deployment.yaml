##
# AI Service Deployment manifest
# Provides a Deployment and ClusterIP Service for the AI API.
##
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: market-intelligence
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
      - name: ai-service
        image: 254carbon/ai-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8020
        # Environment variables for LLM providers and backing services
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-api-keys
              key: openai-key
              optional: true
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-api-keys
              key: anthropic-key
              optional: true
        - name: POSTGRES_HOST
          value: "postgresql"
        - name: POSTGRES_PORT
          value: "5432"
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1"
        # Probes use `/health` for readiness/liveness
        readinessProbe:
          httpGet:
            path: /health
            port: 8020
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8020
          initialDelaySeconds: 60
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: market-intelligence
spec:
  selector:
    app: ai-service
  ports:
  - port: 8020
    targetPort: 8020
  type: ClusterIP
