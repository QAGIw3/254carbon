apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-prometheus
  labels:
    grafana_datasource: "1"
    app.kubernetes.io/name: grafana-datasource
    app.kubernetes.io/part-of: grafana
    app.kubernetes.io/component: datasource
  namespace: platform-observability
data:
  prometheus-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: {{ .Values.prometheusUrl | quote }}
        isDefault: true
        editable: true
