apiVersion: apps/v1
kind: Deployment
metadata:
  name: streaming-service
  namespace: market-intelligence
spec:
  replicas: 2
  selector:
    matchLabels:
      app: streaming-service
  template:
    metadata:
      labels:
        app: streaming-service
    spec:
      containers:
      - name: streaming-service
        image: 254carbon/streaming-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8001
        env:
        - name: DATABASE_URL
          value: postgresql://postgres:postgres@postgresql:5432/market_intelligence
        - name: CLICKHOUSE_HOST
          value: clickhouse
        - name: KAFKA_BOOTSTRAP
          value: kafka:9092
        - name: ENABLE_KAFKA
          value: "true"
        - name: AUTH_SERVICE_URL
          value: http://auth-service:8010
        - name: ENTITLEMENTS_SERVICE_URL
          value: http://entitlements-service:8011
        - name: METRICS_SERVICE_URL
          value: http://metrics-service:8012
        - name: LOCAL_DEV
          value: "false"
        - name: ENVIRONMENT
          value: production
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "8Gi"
            cpu: "4000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 15
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: streaming-service
  namespace: market-intelligence
spec:
  selector:
    app: streaming-service
  ports:
  - port: 8001
    targetPort: 8001
    name: http
  type: ClusterIP

