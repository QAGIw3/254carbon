apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: market-intelligence
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: 254carbon/auth-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8010
        env:
        - name: KEYCLOAK_URL
          value: http://keycloak:8080/auth/realms/254carbon
        - name: KEYCLOAK_AUDIENCE
          value: market-intelligence-api
        - name: PORT
          value: "8010"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8010
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8010
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: market-intelligence
spec:
  selector:
    app: auth-service
  ports:
  - port: 8010
    targetPort: 8010
    name: http
  type: ClusterIP

